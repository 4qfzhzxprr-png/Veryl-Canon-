<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veryl Canon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e6e5c'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- 85 tab stops stood between the top of the document and the page somebody
       had navigated to: the whole sidebar tree is links, and it is first in the
       source on every collection and page route (round seven). This is the way
       out, and it is FIRST, before the brand.

       It is an anchor for the semantics and its default is prevented, because
       in this app `location.hash` IS the router — an href="#main" that was
       allowed through would be parsed as the route "main" and land the reader
       on the collections list. Same trap the [data-scroll-to] handler exists
       for. See wireSkipLink in app.js. -->
  <a class="skip-link" href="#main" id="skip-to-main">Skip to the page</a>
  <header class="topbar">
    <a class="brand" href="#/">Veryl Canon<span class="stage">alpha</span></a>
    <!-- The nav is seven entries; wrapped onto a phone it was three of the four
         rows that made this sticky bar 37.5% of the viewport. It collapses
         behind this, and the queue count comes with it so the reason to open it
         is visible while it is closed. Rendered only under 640px (styles.css);
         `hidden` tracks the nav's own, so a signed-out visitor gets neither. -->
    <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav" hidden>Menu<span
      class="nav-count" id="nav-toggle-count" hidden>0</span></button>
    <div class="search-slot" id="search-slot" hidden>
      <input id="search-input" type="search" placeholder="Search the record&hellip;" autocomplete="off" aria-label="Search the record">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <nav class="topnav" id="topnav" hidden>
      <a href="#/" data-nav="home">Collections</a>
      <!-- The count is the point, not the link: nothing told a Director of
           Compliance that 25 drafts were waiting on him (USER-TESTING.md T2.1). -->
      <a href="#/queue" data-nav="queue" id="nav-queue">My queue<span
        class="nav-count" id="nav-queue-count" hidden>0</span></a>
      <a href="#/ask" data-nav="ask" id="nav-ask" hidden>Ask</a>
      <a href="#/sources" data-nav="sources" id="nav-sources" hidden>Sources</a>
      <a href="#/map" data-nav="map" id="nav-map" hidden>Map</a>
      <a href="#/gaps" data-nav="gaps" id="nav-gaps" hidden>Gaps</a>
      <a href="#/audit" data-nav="audit">Audit</a>
    </nav>
    <div class="actor-chip" id="actor-chip"></div>
  </header>
  <!-- tabindex="-1" so the skip link and every route change have somewhere to
       put focus. It is not in the tab order; only script and the skip link
       reach it. -->
  <main id="app" class="app" tabindex="-1"></main>
  <!-- Route changes are silent in a single-page app: the URL moves, the DOM is
       replaced, and a screen reader is still sitting where it was with nothing
       to tell it otherwise. This is what says so. Separate from #toasts on
       purpose — a toast is the result of an act, a route change is a change of
       place, and one queue for both means a save confirmation can be swallowed
       by a navigation that happened at the same moment. -->
  <div id="route-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
