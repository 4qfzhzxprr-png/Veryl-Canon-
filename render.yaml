# Veryl Canon — Render Blueprint.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# See DEPLOY_RENDER.md for the click-path, the DNS record and the post-deploy
# steps (SSO, the first administrator, backups).
#
# Topology: ONE service and ONE disk. That is not a simplification for the
# blueprint's sake — it is what Canon is. OPERATIONS.md, "The shape of the
# thing": "Canon is one process and one file." There is no database service
# here because the database is a file on the disk below, and no worker service
# because the timers run in-process.
#
# ── Why this shape is a constraint and not a preference ─────────────────────
#
# SQLite in WAL mode takes many readers and ONE writer, and OPERATIONS.md is
# explicit that a network filesystem does not give SQLite correct locking. A
# second instance of this service would be a second writer against one file:
# not slower, WRONG — a corrupted record and an audit log that cannot be
# reconciled, which is the one record this product cannot rebuild.
#
# Render enforces this for us, and it is the reason the disk is load-bearing
# rather than incidental: a service with a disk attached CANNOT be scaled past
# one instance and cannot use zero-downtime deploys. Both restrictions are
# desirable here. Do not "fix" them by removing the disk — that trades the
# record for a spare replica.
#
# A deploy is therefore a brief interruption: the old instance gets SIGTERM,
# src/shutdown.ts drains in-flight requests and closes the database so SQLite
# checkpoints its WAL, and the new one starts. That is the correct trade for a
# single-writer record, and it is why CANON_SHUTDOWN_TIMEOUT_MS matters.

services:
  - type: web
    name: veryl-canon
    runtime: docker
    plan: starter               # a disk requires a paid instance type
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon

    # Readiness, not liveness — src/ready.ts on why the two questions differ.
    # An instance that cannot read its own record answers 503 here and should
    # leave the load balancer rather than be restarted into the same fault.
    healthCheckPath: /ready

    domains:
      - canon.veryl.ai

    # THE RECORD. Everything Canon knows — pages, every version, the
    # append-only audit log — is one SQLite file on this disk. Without it the
    # file lives on the container's writable layer and the record dies with
    # the instance, silently, on the next deploy.
    #
    # Render's blueprint has NO field for a multi-stage build target, so this
    # builds the Dockerfile's final stage. That stage is `canon` deliberately;
    # see the Dockerfile header before reordering anything there.
    disk:
      name: canon-data
      mountPath: /data
      sizeGB: 10

    envVars:
      # ---- the record ------------------------------------------------------
      - key: CANON_DB
        value: /data/canon.db   # MUST be under the mount, or the record dies
                                # with the container (CONFIGURATION.md)
      - key: CANON_BASE_URL
        value: https://canon.veryl.ai
                                # Deep links in mail are built from this, the
                                # OIDC redirect defaults to <base>/auth/callback,
                                # and https here is what puts Secure on the
                                # session cookie.

      # ---- process ---------------------------------------------------------
      # PORT is injected by Render and read by src/index.ts; CANON_BIND is left
      # unset on purpose — config.ts binds 0.0.0.0 once a real door is
      # configured, and 127.0.0.1 only while dev auth is the only door. Setting
      # it by hand is how that safeguard gets defeated.
      - key: CANON_LOG_FORMAT
        value: json
      - key: CANON_LOG_LEVEL
        value: info
      - key: CANON_SHUTDOWN_TIMEOUT_MS
        value: "20000"          # under Render's 30s SIGTERM→SIGKILL delay, so
                                # the WAL checkpoint finishes rather than being
                                # killed halfway

      # ---- identity: people ------------------------------------------------
      # CANON_DEV_AUTH IS ABSENT AND MUST STAY ABSENT. It believes an
      # X-Actor-Id header without verifying it: anyone who can reach this URL
      # would be anyone they name. SECURITY.md §5, assumption 1 — "the one
      # thing a deployment must get right is not setting this."
      #
      # Until the four below are filled in, Canon starts and serves but NOBODY
      # CAN SIGN IN. That is the honest state, not a broken one.
      - key: CANON_OIDC_ISSUER
        sync: false
      - key: CANON_OIDC_CLIENT_ID
        sync: false
      - key: CANON_OIDC_CLIENT_SECRET
        sync: false
      - key: CANON_SESSION_SECRET
        generateValue: true     # signs the session cookie. Invented per process
                                # when unset, which signs everyone out on every
                                # restart; Canon refuses to start with SSO
                                # configured and no secret.

      # Names the first administrator by their subject at the provider, so the
      # role is re-asserted on every sign-in rather than granted to whoever
      # arrives first. Idempotent, and it cannot lock you out.
      - key: CANON_BOOTSTRAP_ADMIN_SUBJECT
        sync: false

      # ---- identity: agents ------------------------------------------------
      # The Agent Registry (agent-studio). Unset, an Agent Passport is refused
      # 503 — agents are denied, never admitted. Point it at the real one;
      # NEVER at registry-stub, which certifies anybody.
      - key: CANON_REGISTRY_URL
        value: https://registry.veryl.ai
      - key: CANON_REGISTRY_API_KEY
        sync: false             # without it the channel is anonymous and
                                # start-up warns

      # ---- everything else -------------------------------------------------
      # Deliberately unset, each degrading visibly rather than silently:
      #   CANON_SMTP_URL / CANON_MAIL_FROM   no relay ⇒ the dev transport logs
      #                                      instead of delivering. Canon
      #                                      refuses to start with one and not
      #                                      the other.
      #   CANON_SOURCE_ALLOWED_HOSTS         unset ⇒ federation reaches
      #                                      NOTHING. Canon refuses to start if
      #                                      a host named here does not resolve.
      #   CANON_GROUP_MAP                    unset ⇒ no directory group grants
      #                                      anything.
      # See CONFIGURATION.md, which is the reference of record for all of them.
